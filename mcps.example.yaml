# MCP server configuration for Chives.
# Each entry under servers is one MCP-over-HTTP endpoint.
#
# Usage:
#   1. Copy this file to mcps.yaml and fill in your server URLs.
#   2. Set CHIVES_MCP_CONFIG_PATH=/app/mcps.yaml in your environment.
#   3. Mount the file into the container (see compose.yml).
#
# Tools are discovered at startup via tools/list and registered automatically.
# If a server is unreachable at startup it is skipped with a warning.

mcp_servers:
  - url: http://host.docker.internal:4000/mcp
    # auth_key: your-secret-key
  # - url: http://another-mcp-server/mcp
  #   auth_key: another-secret-key
