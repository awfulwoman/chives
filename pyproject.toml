[project]
name = "chives"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "python-telegram-bot>=21",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10,<4",
    "pyobjc-framework-EventKit>=10",
    "pyobjc-framework-Contacts>=10",
    "sqlite-vec>=0.1",
    "httpx>=0.25",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
