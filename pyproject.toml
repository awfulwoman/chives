[project]
name = "chives"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "python-telegram-bot>=21",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10,<4",
    "sqlite-vec>=0.1",
    "httpx>=0.25",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: hits the live LLM endpoint; deselected by default, run with `-m live`",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
