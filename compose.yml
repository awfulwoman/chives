services:
  chives:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./state:/app/state
      - ./profile:/app/profile
      - ./mcps.yaml:/app/mcps.yaml:ro
    environment:
      CHIVES_LLM__BASE_URL: http://ollama:11434/v1
      CHIVES_LLM__MODEL: llama3.2
      CHIVES_LLM__API_KEY: ollama
      CHIVES_MCP_CONFIG_PATH: /app/mcps.yaml
      CHIVES_EVENT_REMINDER_MINUTES: "15"
      CHIVES_IDLE_CHECKIN_HOURS: "0"
      # CHIVES_TELEGRAM__BOT_TOKEN: ...
      # CHIVES_TELEGRAM__ALLOWED_CHAT_IDS: "[123456789]"
    restart: unless-stopped

